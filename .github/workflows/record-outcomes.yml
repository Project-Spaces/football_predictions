name: Record Game Outcomes

on:
  schedule:
    # 08:00 UTC daily — after most previous day's matches have finished
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to record (YYYY-MM-DD, default: yesterday)'
        required: false
        default: ''

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_VIA_RAPIDAPI: "false"
      SITE_API_TOKEN: ${{ secrets.SITE_API_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get yesterday's date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date -d 'yesterday' +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      # Restore fixture stats cache (read-only — no save needed here)
      - name: Restore fixture stats cache
        uses: actions/cache/restore@v4
        with:
          path: .tmp/fixture_stats_*.json
          key: fixture-stats-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            fixture-stats-v1-

      - name: Create .tmp directory
        run: mkdir -p .tmp

      - name: Record game outcomes
        run: |
          python3 tools/batch_record_outcomes.py \
            --date ${{ steps.date.outputs.date }} \
            --url ${{ secrets.VERCEL_URL }}

      - name: Summary
        if: always()
        run: |
          echo "### Outcome recording complete" >> $GITHUB_STEP_SUMMARY
          echo "Date processed: ${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "Check your Vercel dashboard → Neon → market_outcomes table for results." >> $GITHUB_STEP_SUMMARY
