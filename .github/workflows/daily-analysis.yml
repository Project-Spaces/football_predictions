name: Daily Predictions & Market Analysis

on:
  schedule:
    # 02:00 UTC daily — 9 PM CT (CDT), early enough to capture next day's fixtures
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # full pipeline with rate-limited API calls can take ~60 min

    permissions:
      contents: write  # needed to commit predictions.json back to repo

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      API_FOOTBALL_VIA_RAPIDAPI: "false"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get today's date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Restore cached fixture stats to stay within 100 req/day free API limit.
      # Historical fixture stats are fetched once and never re-fetched.
      - name: Restore fixture stats cache
        uses: actions/cache@v4
        with:
          path: .tmp/fixture_stats_*.json
          key: fixture-stats-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            fixture-stats-v1-

      # Restore previous predictions as fallback if today's scraping fails
      - name: Restore predictions cache (fallback)
        uses: actions/cache@v4
        with:
          path: .tmp/soccervista_predictions.xlsx
          key: predictions-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            predictions-v1-

      - name: Create .tmp directory
        run: mkdir -p .tmp

      # ── Step 1: Scrape & parse SoccerVista ───────────────────────────────────
      - name: Scrape SoccerVista predictions
        continue-on-error: true
        run: python3 tools/scrape_soccervista.py

      - name: Parse SoccerVista predictions
        continue-on-error: true
        run: python3 tools/parse_soccervista.py

      # Save today's predictions so they can be used as fallback tomorrow
      - name: Save predictions cache
        if: hashFiles('.tmp/soccervista_predictions.xlsx') != ''
        uses: actions/cache@v4
        with:
          path: .tmp/soccervista_predictions.xlsx
          key: predictions-v1-${{ steps.date.outputs.date }}

      # Abort if no predictions were generated and none restored from cache
      - name: Check predictions exist
        run: |
          if [ ! -f .tmp/soccervista_predictions.xlsx ]; then
            echo "::error::soccervista_predictions.xlsx not found — scraping failed and no cached fallback available"
            exit 1
          fi
          echo "Predictions file found"

      # ── Step 2: Regenerate predictions.json and commit to trigger Vercel deploy ──
      - name: Generate predictions.json
        run: python3 tools/csv_to_json.py

      - name: Commit and push updated predictions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/data/predictions.json
          if git diff --cached --quiet; then
            echo "No changes to predictions.json — skipping commit"
          else
            git commit -m "chore: update predictions.json [skip ci]"
            git push
          fi

      # ── Step 3: Fetch H2H stats + analyze markets ─────────────────────────
      - name: Run market analysis (top 5 predictions)
        run: |
          python3 tools/batch_analyze_predictions.py \
            --top 5 \
            --upload-all \
            --url ${{ secrets.VERCEL_URL }}

      # Save updated fixture stats cache for future runs
      - name: Save fixture stats cache
        if: always()
        uses: actions/cache@v4
        with:
          path: .tmp/fixture_stats_*.json
          key: fixture-stats-v1-${{ steps.date.outputs.date }}

      - name: Summary
        if: always()
        run: |
          echo "### Pipeline complete — ${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          if [ -f .tmp/soccervista_predictions.xlsx ]; then
            echo "Predictions file: present" >> $GITHUB_STEP_SUMMARY
          else
            echo "Predictions file: missing" >> $GITHUB_STEP_SUMMARY
          fi
          ANALYSES=$(ls .tmp/market_analysis_*.json 2>/dev/null | wc -l)
          echo "Market analyses generated: $ANALYSES" >> $GITHUB_STEP_SUMMARY
          FIXTURE_CACHE=$(ls .tmp/fixture_stats_*.json 2>/dev/null | wc -l)
          echo "Fixture stats cached: $FIXTURE_CACHE files" >> $GITHUB_STEP_SUMMARY
